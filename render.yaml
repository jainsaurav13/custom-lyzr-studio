# One-click hosting on Render: New → Blueprint → point it at this repo.
# Any other Node host works the same way — build, then `npm start`, which
# serves dist/client and the SSR/API handler on $PORT.
services:
  - type: web
    name: lyzr-brand-studio
    runtime: node
    # Free plan sleeps after 15 minutes idle and takes ~50s to wake. Switch to
    # `starter` before putting a link in front of a customer.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
